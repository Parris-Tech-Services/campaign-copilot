name: One-time Actions artifact cleanup
on:
  push:
    paths:
      - '.github/workflows/cleanup-actions-artifacts-once.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old storage-heavy artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while IFS=$'\t' read -r id name; do
            if [[ "$name" == "campaign-offline-evidence-*" ]]; then
              echo "Deleting artifact $id ($name)"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
              deleted=$((deleted + 1))
            fi
          done < <(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .name] | @tsv')
          echo "Deleted $deleted matching artifacts."
